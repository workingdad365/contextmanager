[package]
name = "contextmanager"
version = "1.1.0"
edition = "2024"
description = "ContextManager - Windows 탐색기 컨텍스트 메뉴 관리 도구"

[[bin]]
name = "ContextManager"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[package.metadata.winresource]
ProductName = "ContextManager"
FileDescription = "ContextManager - Windows 탐색기 컨텍스트 메뉴 관리 도구"
LegalCopyright = "Copyright (c) 2026"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
